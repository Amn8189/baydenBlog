{% include "base.html" %}
{% block content %}

<div class="container text-white">
    <form method="POST" enctype="multipart/form-data" action="{% url 'updateArticle' article.id %}">
        {% csrf_token %}
        <label>Image</label>
        <input name="image" type="file" required />
        <img src="{{article.image.url}}" class="img-fluid" style="width: 25%; height: 25%; object-fit: cover; object-position: center;"/>
        <label>Title</label>
        <input name="title" required value="{{article.title}}"/>
        <label>Content</label>
        <textarea name="content" id="content">{{article.content}}</textarea>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
<script>
    tinymce.init({
        selector: "#content",
        plugins: "lists link preview",
        toolbar: "undo redo | bold italic underline | numlist bullist indent outdent | link",
        height: "300",
        content_css: ["https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"],
    })
</script>

{% endblock content %}
