{% include "base.html" %}
{% block content %}

<div class="container">
    <form method="POST" enctype="multipart/form-data" action="{% url 'createArticle' %}">
        {% csrf_token %}
        <label>Image</label>
        <input name="image" type="file" required />
        <label>Title</label>
        <input name="title" required />
        <label>Content</label>
        <textarea name="content" id="content"></textarea>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
<script>
    tinymce.init({
        selector: "#content",
        plugins: "lists link preview",
        toolbar: "undo redo | bold italic underline | numlist bullist indent outdent | link",
        height: "300",
        content_css: ["https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"],
    })
</script>

{% endblock content %}
