<p class="text-white">{{article.content}}</p>
<div>
    <form method="POST" action="{% url 'saveComment' %}">
        {% csrf_token %}
        <input name="comment" class="form-control" placeholder="Leave a comment..." />
        <input name="article_id " type="hidden" value="{{ article.id }}"/>
        <button type="submit" class="btn btn-primary rounded-4">Submit</button>
    </form>

    {% for c in comments %}
    {{c.content}}
    {% endfor %}
</div>
